---
- name: Installer Apache
  ansible.builtin.apt:
    name: apache2
    state: present

- name: Activer les modules Apache nécessaires
  ansible.builtin.command: "a2enmod {{ item }}"
  args:
    creates: "/etc/apache2/mods-enabled/{{ item }}.load"
  loop:
    - rewrite
    - "php{{ prestashop_php_version }}"
  notify: Redémarrer Apache

- name: Déployer le virtual host PrestaShop
  ansible.builtin.template:
    src: prestashop.conf.j2
    dest: /etc/apache2/sites-available/prestashop.conf
    owner: root
    group: root
    mode: "0644"
  notify: Recharger Apache

- name: Activer le site PrestaShop
  ansible.builtin.file:
    src: /etc/apache2/sites-available/prestashop.conf
    dest: /etc/apache2/sites-enabled/prestashop.conf
    state: link
  notify: Recharger Apache

- name: Désactiver le site par défaut
  ansible.builtin.file:
    path: /etc/apache2/sites-enabled/000-default.conf
    state: absent
  notify: Recharger Apache

- name: Démarrer et activer Apache
  ansible.builtin.service:
    name: apache2
    state: started
    enabled: true
